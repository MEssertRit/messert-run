<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M’Essert Run — Planning général</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f1e8;
        color: #202020;
    }

    header {
        background: #202020;
        padding: 20px;
        text-align: center;
    }

    header img {
        width: 130px;
        max-width: 55%;
    }

    main {
        max-width: 1000px;
        margin: auto;
        padding: 25px 20px 50px;
    }

    .title {
        text-align: center;
        margin-bottom: 30px;
    }

    .title h1 {
        margin-bottom: 8px;
    }

    .title p {
        color: #666;
    }

    .planning {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

.event {
    background: white;
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}

.event.race {
    background: #fff3e6;
    border-left: 5px solid #e6a15c;
}

    .event-top {
        display: grid;
        grid-template-columns: 80px 1fr;
        gap: 15px;
        align-items: start;
    }

    .time {
        font-size: 18px;
        font-weight: bold;
        padding-top: 2px;
    }

    .category {
        display: inline-block;
        font-size: 12px;
        font-weight: bold;
        color: #777;
        text-transform: uppercase;
        margin-bottom: 4px;
    }

    .mission-title {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 6px;
    }

    .details {
        color: #555;
        font-size: 14px;
        line-height: 1.5;
    }

    .volunteers {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 15px;
        padding-top: 14px;
        border-top: 1px solid #eee;
    }

    .volunteer {
        background: #f5f1e8;
        border-radius: 10px;
        padding: 9px 12px;
        font-size: 14px;
    }

    .volunteer strong {
        display: block;
    }

    .volunteer a {
        color: #555;
        text-decoration: none;
        font-size: 13px;
    }

    .no-volunteers {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid #eee;
        color: #888;
        font-size: 13px;
        font-style: italic;
    }

    .loading,
    .empty,
    .error {
        background: white;
        padding: 25px;
        border-radius: 16px;
        text-align: center;
    }

    .back {
        display: block;
        text-align: center;
        margin-top: 30px;
        color: #202020;
        text-decoration: none;
        font-weight: bold;
    }

    @media (max-width: 600px) {

        main {
            padding: 20px 14px 40px;
        }

        .event-top {
            grid-template-columns: 60px 1fr;
            gap: 10px;
        }

        .mission-title {
            font-size: 18px;
        }

        .time {
            font-size: 16px;
        }
    }
</style>
</head>

<body>

<header>
    <img src="logo-messert-run.svg" alt="M’Essert Run">
</header>

<main>

    <div class="title">
        <h1>📅 Planning général</h1>
        <p>M’Essert Run — dimanche 8 novembre 2026</p>
    </div>

    <div id="planning" class="loading">
        Chargement du planning...
    </div>

    <a class="back" href="espace-benevoles.html">
        ← Retour à l’espace bénévoles
    </a>

</main>

<script>

const fixedEvents = [
    {
        start_time: "08:45",
        category: "🚶 COURSE",
        title: "Départ de la Marche",
        details: "5,8 km — route ouverte, pas de signaleurs",
       race: true,
    },
    {
        start_time: "09:00",
        category: "🐢 COURSE",
        title: "Course de la Tortue",
        details: "900 m",
       race: true,
    },
    {
        start_time: "09:15",
        category: "🐇 COURSE",
        title: "Course du Lièvre",
        details: "2,4 km",
       race: true,
    },
    {
        start_time: "09:45",
        category: "🔴 COURSE",
        title: "Course 10 km",
        details: "10 km",
       race: true,
    }
];

async function loadPlanning() {

    const container = document.getElementById("planning");

    try {

        const [
            missionsResponse,
            assignmentsResponse
        ] = await Promise.all([
            fetch("/api/missions"),
            fetch("/api/assignments")
        ]);

        if (!missionsResponse.ok || !assignmentsResponse.ok) {
            throw new Error("Erreur API");
        }

        const missions = await missionsResponse.json();
        const assignments = await assignmentsResponse.json();

        const events = [
            ...fixedEvents,
            ...missions
        ];

        events.sort((a, b) => {
            return (a.start_time || "").localeCompare(b.start_time || "");
        });

        container.innerHTML = "";

        if (events.length === 0) {
            container.innerHTML = `
                <div class="empty">
                    Aucun élément dans le planning pour le moment.
                </div>
            `;
            return;
        }

        events.forEach(event => {

const card = document.createElement("div");
card.className = event.race ? "event race" : "event";

            const isMission = event.id !== undefined;

            const missionAssignments = isMission
                ? assignments.filter(
                    assignment =>
                        Number(assignment.mission_id) === Number(event.id)
                )
                : [];

            const endTime = event.end_time
                ? ` → ${event.end_time}`
                : "";

            let volunteersHTML = "";

            if (missionAssignments.length > 0) {

                volunteersHTML = `
                    <div class="volunteers">
                        ${missionAssignments.map(person => `
                            <div class="volunteer">
                                <strong>
                                    👤 ${person.first_name} ${person.last_name}
                                </strong>
                                ${
                                    person.phone
                                    ? `<a href="tel:${person.phone}">
                                        📞 ${person.phone}
                                       </a>`
                                    : ""
                                }
                            </div>
                        `).join("")}
                    </div>
                `;

            } else if (isMission) {

                volunteersHTML = `
                    <div class="no-volunteers">
                        Aucun bénévole affecté pour le moment.
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="event-top">

                    <div class="time">
                        ${event.start_time || ""}
                        ${endTime}
                    </div>

                    <div>

                        <div class="category">
                            ${event.category || ""}
                        </div>

                        <div class="mission-title">
                            ${event.title}
                        </div>

                        ${
                            event.details
                            ? `<div class="details">${event.details}</div>`
                            : ""
                        }

                        ${
                            event.race
                            ? `<div class="details">🏃 ${event.race}</div>`
                            : ""
                        }

                        ${
                            event.location
                            ? `<div class="details">📍 ${event.location}</div>`
                            : ""
                        }

                        ${
                            event.instructions
                            ? `<div class="details">📝 ${event.instructions}</div>`
                            : ""
                        }

                        ${volunteersHTML}

                    </div>

                </div>
            `;

            container.appendChild(card);
        });

    } catch (error) {

        container.innerHTML = `
            <div class="error">
                Impossible de charger le planning.
            </div>
        `;
    }
}

loadPlanning();

</script>

</body>
</html>
