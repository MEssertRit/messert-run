<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M’Essert Run — Qui fait quoi ?</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f1e8;
    color: #202020;
}

header {
    background: #202020;
    padding: 20px;
    text-align: center;
}

header img {
    width: 130px;
    max-width: 55%;
}

main {
    max-width: 900px;
    margin: auto;
    padding: 25px 20px 50px;
}

.title {
    text-align: center;
    margin-bottom: 30px;
}

.title h1 {
    margin-bottom: 8px;
}

.title p {
    color: #666;
}

.volunteer-card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 5px 15px rgba(0,0,0,.08);
}

.volunteer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 15px;
}

.volunteer-name {
    font-size: 21px;
    font-weight: bold;
}

.phone {
    color: #555;
    text-decoration: none;
    font-size: 14px;
}

.mission {
    display: grid;
    grid-template-columns: 70px 1fr;
    gap: 12px;
    padding: 12px 0;
    border-top: 1px solid #eee;
}

.mission:first-child {
    border-top: 0;
}

.time {
    font-weight: bold;
    font-size: 16px;
}

.category {
    font-size: 12px;
    color: #777;
    font-weight: bold;
    text-transform: uppercase;
    margin-bottom: 3px;
}

.mission-title {
    font-size: 17px;
    font-weight: bold;
}

.details {
    margin-top: 4px;
    font-size: 13px;
    color: #666;
}

.empty {
    background: white;
    padding: 25px;
    border-radius: 16px;
    text-align: center;
    color: #777;
}

.back {
    display: block;
    text-align: center;
    margin-top: 30px;
    color: #202020;
    text-decoration: none;
    font-weight: bold;
}

@media (max-width: 600px) {

    main {
        padding: 20px 14px 40px;
    }

    .volunteer-header {
        display: block;
    }

    .phone {
        display: inline-block;
        margin-top: 6px;
    }

    .mission {
        grid-template-columns: 60px 1fr;
        gap: 8px;
    }

}

</style>
</head>

<body>

<header>
    <img src="logo-messert-run.svg" alt="M’Essert Run">
</header>

<main>

    <div class="title">
        <h1>👥 Qui fait quoi ?</h1>
        <p>
            Retrouvez les missions de chaque bénévole,
            dans l’ordre de la journée.
        </p>
    </div>

    <div id="volunteers">
        Chargement...
    </div>

    <a class="back" href="espace-benevoles.html">
        ← Retour à l’espace bénévoles
    </a>

</main>


<script>

async function loadVolunteers() {

    const container =
        document.getElementById("volunteers");

    try {

        const [
            volunteersResponse,
            missionsResponse,
            assignmentsResponse
        ] = await Promise.all([

            fetch("/api/volunteers"),
            fetch("/api/missions"),
            fetch("/api/assignments")

        ]);


        if (
            !volunteersResponse.ok ||
            !missionsResponse.ok ||
            !assignmentsResponse.ok
        ) {
            throw new Error();
        }


        const volunteers =
            await volunteersResponse.json();

        const missions =
            await missionsResponse.json();

        const assignments =
            await assignmentsResponse.json();


        /*
         * On ne garde que les bénévoles
         * ayant au moins une mission.
         */

        const activeVolunteers =
            volunteers.filter(volunteer =>
                assignments.some(
                    assignment =>
                        Number(assignment.volunteer_id)
                        === Number(volunteer.id)
                )
            );


        container.innerHTML = "";


        if (activeVolunteers.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    Aucun bénévole n'est encore affecté
                    à une mission.
                </div>
            `;

            return;
        }


        /*
         * Tri alphabétique des bénévoles
         */

        activeVolunteers.sort((a, b) => {

            const nameA =
                `${a.last_name} ${a.first_name}`;

            const nameB =
                `${b.last_name} ${b.first_name}`;

            return nameA.localeCompare(
                nameB,
                "fr"
            );

        });


        activeVolunteers.forEach(volunteer => {

            const volunteerAssignments =
                assignments
                    .filter(
                        assignment =>
                            Number(
                                assignment.volunteer_id
                            )
                            === Number(volunteer.id)
                    )
                    .map(assignment => {

                        const mission =
                            missions.find(
                                m =>
                                    Number(m.id)
                                    === Number(
                                        assignment.mission_id
                                    )
                            );

                        return {
                            assignment,
                            mission
                        };

                    })
                    .filter(item => item.mission)
                    .sort((a, b) =>
                        (a.mission.start_time || "")
                            .localeCompare(
                                b.mission.start_time || ""
                            )
                    );


            const card =
                document.createElement("div");

            card.className =
                "volunteer-card";


            const phone =
                volunteer.phone
                    ? `
                        <a
                            class="phone"
                            href="tel:${volunteer.phone}"
                        >
                            📞 ${volunteer.phone}
                        </a>
                      `
                    : "";


            card.innerHTML = `

                <div class="volunteer-header">

                    <div class="volunteer-name">
                        👤 ${volunteer.first_name}
                        ${volunteer.last_name}
                    </div>

                    ${phone}

                </div>


                <div>

                    ${volunteerAssignments.map(item => {

                        const mission =
                            item.mission;

                        const time =
                            mission.start_time
                                ? `${mission.start_time}${mission.end_time ? " → " + mission.end_time : ""}`
                                : "—";


                        return `

                            <div class="mission">

                                <div class="time">
                                    ${time}
                                </div>

                                <div>

                                    <div class="category">
                                        ${mission.category || ""}
                                    </div>

                                    <div class="mission-title">
                                        ${mission.title}
                                    </div>

                                    ${
                                        mission.location
                                            ? `
                                            <div class="details">
                                                📍 ${mission.location}
                                            </div>
                                            `
                                            : ""
                                    }

                                    ${
                                        mission.race
                                            ? `
                                            <div class="details">
                                                🏃 ${mission.race}
                                            </div>
                                            `
                                            : ""
                                    }

                                    ${
                                        mission.instructions
                                            ? `
                                            <div class="details">
                                                📝 ${mission.instructions}
                                            </div>
                                            `
                                            : ""
                                    }

                                </div>

                            </div>

                        `;

                    }).join("")}

                </div>

            `;


            container.appendChild(card);

        });


    } catch {

        container.innerHTML = `
            <div class="empty">
                Impossible de charger les affectations.
            </div>
        `;

    }

}


loadVolunteers();

</script>

</body>
</html>
