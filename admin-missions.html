<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M’Essert Run — Gestion des missions</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f1e8;
    color: #202020;
}

header {
    background: #202020;
    padding: 20px;
    text-align: center;
}

header img {
    width: 130px;
    max-width: 55%;
}

main {
    max-width: 900px;
    margin: auto;
    padding: 25px 20px 50px;
}

h1 {
    text-align: center;
    margin-bottom: 30px;
}

.box {
    background: white;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,.08);
}

.box h2 {
    margin-top: 0;
}

label {
    display: block;
    margin: 12px 0 6px;
    font-weight: bold;
}

input,
select,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button {
    width: 100%;
    margin-top: 18px;
    padding: 13px;
    border: 0;
    border-radius: 8px;
    background: #b84b3f;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button.secondary {
    background: #777;
}

button.cancel {
    background: #202020;
}

.message {
    text-align: center;
    font-weight: bold;
    margin: 15px 0;
}

.mission-card,
.assignment-card {
    background: #f5f1e8;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 12px;
}

.mission-card h3 {
    margin: 0 0 8px;
    font-size: 19px;
}

.category {
    font-size: 13px;
    color: #777;
    font-weight: bold;
    margin-bottom: 5px;
}

.details {
    color: #555;
    font-size: 14px;
    line-height: 1.5;
}

.actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

.actions button {
    width: auto;
    margin: 0;
    padding: 9px 12px;
    font-size: 14px;
}

.edit {
    background: #202020;
}

.delete {
    background: #777;
}

.assignment-card {
    background: white;
    border: 1px solid #eee;
}

.assignment-card strong {
    display: block;
    margin-bottom: 5px;
}

.empty {
    color: #777;
    font-style: italic;
}

.back {
    display: block;
    text-align: center;
    margin-top: 30px;
    color: #202020;
    text-decoration: none;
    font-weight: bold;
}

@media (max-width: 600px) {

    main {
        padding: 20px 14px 40px;
    }

    .actions {
        flex-direction: column;
    }

    .actions button {
        width: 100%;
    }

}

</style>
</head>

<body>

<header>
    <img src="logo-messert-run.svg" alt="M’Essert Run">
</header>

<main>

<h1>📋 Gestion des missions</h1>


<!-- ========================= -->
<!-- CREER / MODIFIER MISSION -->
<!-- ========================= -->

<div class="box">

    <h2 id="form-title">➕ Ajouter une mission</h2>

    <form id="mission-form">

        <label for="title">Mission / poste</label>

        <input
            id="title"
            required
            placeholder="Ex. Service bar"
        >


        <label for="category">Catégorie</label>

        <select id="category">

            <option value="">— Choisir —</option>

            <option>🚧 Sécurité / signaleur</option>
            <option>🍽️ Repas</option>
            <option>🍺 Bar</option>
            <option>🚗 Parking</option>
            <option>🏁 Course</option>
            <option>🔧 Installation / démontage</option>
            <option>💧 Ravitaillement</option>
            <option>⏱️ Chronométrage</option>
            <option>🎤 Animation</option>
            <option>🔥 Cuisine / four</option>
            <option>📋 Dossards</option>

        </select>


        <label for="race">Course / épreuve</label>

        <select id="race">
    <option value="">— Aucune —</option>
    <option value="Course 10km">Course 10km</option>
    <option value="Course de la Tortue">Course de la Tortue</option>
    <option value="Course du Lièvre">Course du Lièvre</option>
</select>

        <label for="location">Lieu</label>

        <input
            id="location"
            placeholder="Ex. Rond-Point / Seppe"
        >


        <label for="start_time">Début</label>

        <input
            id="start_time"
            type="time"
        >


        <label for="end_time">Fin</label>

        <input
            id="end_time"
            type="time"
        >


        <label for="people_needed">
            Nombre de personnes
        </label>

        <input
            id="people_needed"
            type="number"
            min="1"
            value="1"
        >


        <label>

            <input
                id="optional"
                type="checkbox"
                style="width:auto;"
            >

            Mission facultative

        </label>


        <label for="instructions">
            Instructions
        </label>

        <textarea
            id="instructions"
            placeholder="Informations utiles pour les bénévoles"
        ></textarea>


        <button type="submit" id="save-button">
            AJOUTER LA MISSION
        </button>

        <button
            type="button"
            id="cancel-button"
            class="cancel"
            style="display:none;"
        >
            ANNULER
        </button>

    </form>

    <div id="message" class="message"></div>

</div>


<!-- ========================= -->
<!-- MISSIONS EXISTANTES -->
<!-- ========================= -->

<div class="box">

    <h2>📋 Missions existantes</h2>

    <div id="missions-list">
        Chargement...
    </div>

</div>


<!-- ========================= -->
<!-- AFFECTATION -->
<!-- ========================= -->

<div class="box">

    <h2>👥 Affecter un bénévole</h2>


    <label for="assignment-mission">
        Mission
    </label>

    <select id="assignment-mission">

        <option value="">
            — Choisir une mission —
        </option>

    </select>


    <label for="assignment-volunteer">
        Bénévole
    </label>

    <select id="assignment-volunteer">

        <option value="">
            — Choisir un bénévole —
        </option>

    </select>


    <button
        type="button"
        id="assign-button"
    >
        AFFECTER LE BÉNÉVOLE
    </button>


    <div
        id="assignment-message"
        class="message"
    ></div>

</div>


<!-- ========================= -->
<!-- AFFECTATIONS -->
<!-- ========================= -->

<div class="box">

    <h2>🔗 Affectations actuelles</h2>

    <div id="current-assignments">
        Chargement...
    </div>

</div>


<a
    class="back"
    href="administration.html"
>
    ← Retour à l’administration
</a>

</main>


<script>

let editingMissionId = null;


/* ========================= */
/* CHARGEMENT GLOBAL */
/* ========================= */

async function loadAll() {

    await loadMissions();
    await loadAssignmentLists();
}


/* ========================= */
/* MISSIONS */
/* ========================= */

async function loadMissions() {

    const container =
        document.getElementById("missions-list");

    try {

        const response =
            await fetch("/api/missions");

        if (!response.ok) {
            throw new Error();
        }

        const missions =
            await response.json();

        container.innerHTML = "";

        if (missions.length === 0) {

            container.innerHTML =
                '<div class="empty">Aucune mission enregistrée.</div>';

            return;
        }


        missions.forEach(mission => {

            const card =
                document.createElement("div");

            card.className =
                "mission-card";


            const time =
                mission.start_time
                    ? `${mission.start_time}${mission.end_time ? " → " + mission.end_time : ""}`
                    : "Horaire non défini";


            card.innerHTML = `

                <div class="category">
                    ${mission.category || "Sans catégorie"}
                </div>

                <h3>
                    ${time} — ${mission.title}
                </h3>

                ${
                    mission.race
                    ? `<div class="details">🏃 ${mission.race}</div>`
                    : ""
                }

                ${
                    mission.location
                    ? `<div class="details">📍 ${mission.location}</div>`
                    : ""
                }

                <div class="details">
                    👥 ${mission.people_needed || 1} personne(s)
                </div>

                ${
                    mission.optional
                    ? `<div class="details">ℹ️ Mission facultative</div>`
                    : ""
                }

                ${
                    mission.instructions
                    ? `<div class="details">📝 ${mission.instructions}</div>`
                    : ""
                }

                <div class="actions">

                    <button
                        class="edit"
                        type="button"
                        onclick="editMission(${mission.id})"
                    >
                        ✏️ Modifier
                    </button>

                    <button
                        class="delete"
                        type="button"
                        onclick="deleteMission(${mission.id})"
                    >
                        🗑️ Supprimer
                    </button>

                </div>
            `;

            container.appendChild(card);

        });

    } catch {

        container.innerHTML =
            '<div class="empty">Impossible de charger les missions.</div>';

    }

}


/* ========================= */
/* MODIFIER MISSION */
/* ========================= */

async function editMission(id) {

    try {

        const response =
            await fetch("/api/missions");

        const missions =
            await response.json();

        const mission =
            missions.find(
                m => Number(m.id) === Number(id)
            );

        if (!mission) {
            alert("Mission introuvable.");
            return;
        }


        editingMissionId =
            mission.id;


        document.getElementById("form-title")
            .textContent =
            "✏️ Modifier la mission";


        document.getElementById("title").value =
            mission.title || "";


        document.getElementById("category").value =
            mission.category || "";


        document.getElementById("race").value =
            mission.race || "";


        document.getElementById("location").value =
            mission.location || "";


        document.getElementById("start_time").value =
            mission.start_time || "";


        document.getElementById("end_time").value =
            mission.end_time || "";


        document.getElementById("people_needed").value =
            mission.people_needed || 1;


        document.getElementById("optional").checked =
            Number(mission.optional) === 1;


        document.getElementById("instructions").value =
            mission.instructions || "";


        document.getElementById("save-button")
            .textContent =
            "💾 ENREGISTRER LES MODIFICATIONS";


        document.getElementById("cancel-button")
            .style.display =
            "block";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    } catch {

        alert("Impossible de charger la mission.");

    }

}


/* ========================= */
/* ANNULER MODIFICATION */
/* ========================= */

document.getElementById("cancel-button")
    .addEventListener("click", function() {

        editingMissionId = null;

        document.getElementById("mission-form").reset();

        document.getElementById("people_needed").value = 1;

        document.getElementById("form-title")
            .textContent =
            "➕ Ajouter une mission";

        document.getElementById("save-button")
            .textContent =
            "AJOUTER LA MISSION";

        this.style.display =
            "none";

        document.getElementById("message")
            .textContent =
            "";

    });


/* ========================= */
/* ENREGISTRER MISSION */
/* ========================= */

document.getElementById("mission-form")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const data = {

            title:
                document.getElementById("title").value,

            category:
                document.getElementById("category").value,

            race:
                document.getElementById("race").value,

            location:
                document.getElementById("location").value,

            start_time:
                document.getElementById("start_time").value,

            end_time:
                document.getElementById("end_time").value,

            people_needed:
                document.getElementById("people_needed").value,

            optional:
                document.getElementById("optional").checked,

            instructions:
                document.getElementById("instructions").value

        };


        const url =
            "/api/missions";


        const method =
            editingMissionId
                ? "PUT"
                : "POST";


        const body =
            editingMissionId
                ? {
                    ...data,
                    id: editingMissionId
                }
                : data;


        try {

            const response =
                await fetch(url, {

                    method: method,

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(body)

                });


            const result =
                await response.json();


            if (!response.ok || !result.success) {

                throw new Error(
                    result.error ||
                    "Erreur"
                );

            }


            document.getElementById("message")
                .textContent =
                editingMissionId
                    ? "✅ Mission modifiée."
                    : "✅ Mission ajoutée.";


            editingMissionId = null;


            this.reset();


            document.getElementById("people_needed")
                .value = 1;


            document.getElementById("form-title")
                .textContent =
                "➕ Ajouter une mission";


            document.getElementById("save-button")
                .textContent =
                "AJOUTER LA MISSION";


            document.getElementById("cancel-button")
                .style.display =
                "none";


            await loadAll();

        } catch {

            document.getElementById("message")
                .textContent =
                "Impossible d'enregistrer la mission.";

        }

    });


/* ========================= */
/* SUPPRIMER MISSION */
/* ========================= */

async function deleteMission(id) {

    const confirmation =
        confirm(
            "Supprimer cette mission ?\n\nLes affectations liées à cette mission seront également supprimées."
        );


    if (!confirmation) {
        return;
    }


    try {

        const response =
            await fetch("/api/missions", {

                method: "DELETE",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({
                        id: id
                    })

            });


        const result =
            await response.json();


        if (!response.ok || !result.success) {

            alert(
                result.error ||
                "Impossible de supprimer la mission."
            );

            return;
        }


        await loadAll();


    } catch {

        alert(
            "Impossible de communiquer avec le serveur."
        );

    }

}


/* ========================= */
/* LISTES AFFECTATIONS */
/* ========================= */

async function loadAssignmentLists() {

    const missionSelect =
        document.getElementById(
            "assignment-mission"
        );

    const volunteerSelect =
        document.getElementById(
            "assignment-volunteer"
        );

    const assignmentsContainer =
        document.getElementById(
            "current-assignments"
        );


    try {

        const [
            missionsResponse,
            volunteersResponse,
            assignmentsResponse
        ] = await Promise.all([

            fetch("/api/missions"),

            fetch("/api/volunteers"),

            fetch("/api/assignments")

        ]);


        if (
            !missionsResponse.ok ||
            !volunteersResponse.ok ||
            !assignmentsResponse.ok
        ) {

            throw new Error();

        }


        const missions =
            await missionsResponse.json();

        const volunteers =
            await volunteersResponse.json();

        const assignments =
            await assignmentsResponse.json();


        missionSelect.innerHTML =
            '<option value="">— Choisir une mission —</option>';


        volunteerSelect.innerHTML =
            '<option value="">— Choisir un bénévole —</option>';


        missions.forEach(mission => {

            const option =
                document.createElement("option");


            option.value =
                mission.id;


            option.textContent =
                `${mission.start_time || ""} — ${mission.title}`;


            missionSelect.appendChild(option);

        });


        volunteers.forEach(volunteer => {

            const option =
                document.createElement("option");


            option.value =
                volunteer.id;


            option.textContent =
                `${volunteer.first_name} ${volunteer.last_name}`;


            volunteerSelect.appendChild(option);

        });


        assignmentsContainer.innerHTML = "";


        if (assignments.length === 0) {

            assignmentsContainer.innerHTML =
                '<p class="empty">Aucune affectation pour le moment.</p>';

            return;

        }


        assignments.forEach(assignment => {

            const mission =
                missions.find(
                    m =>
                        Number(m.id) ===
                        Number(assignment.mission_id)
                );


            const card =
                document.createElement("div");


            card.className =
                "assignment-card";


            card.innerHTML = `

                <strong>
                    ${mission
                        ? mission.title
                        : "Mission inconnue"}
                </strong>

                <div>
                    👤 ${assignment.first_name}
                    ${assignment.last_name}
                </div>

                ${
                    assignment.phone
                    ? `<div class="details">
                        📞 ${assignment.phone}
                       </div>`
                    : ""
                }

                <div class="actions">

                    <button
                        class="delete"
                        type="button"
                        onclick="deleteAssignment(${assignment.id})"
                    >
                        🗑️ Retirer
                    </button>

                </div>
            `;


            assignmentsContainer.appendChild(card);

        });

    } catch {

        assignmentsContainer.innerHTML =
            '<p class="empty">Impossible de charger les affectations.</p>';

    }

}


/* ========================= */
/* AFFECTER BÉNÉVOLE */
/* ========================= */

document.getElementById("assign-button")
    .addEventListener("click", async function() {

        const missionId =
            document.getElementById(
                "assignment-mission"
            ).value;


        const volunteerId =
            document.getElementById(
                "assignment-volunteer"
            ).value;


        const message =
            document.getElementById(
                "assignment-message"
            );


        if (!missionId || !volunteerId) {

            message.textContent =
                "Choisissez une mission et un bénévole.";

            return;

        }


        try {

            const response =
                await fetch("/api/assignments", {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            mission_id:
                                missionId,

                            volunteer_id:
                                volunteerId

                        })

                });


            const result =
                await response.json();


            if (!response.ok || !result.success) {

                message.textContent =
                    result.error ||
                    "Impossible d'affecter le bénévole.";

                return;

            }


            message.textContent =
                "✅ Bénévole affecté à la mission.";


            document.getElementById(
                "assignment-volunteer"
            ).value = "";


            await loadAssignmentLists();

        } catch {

            message.textContent =
                "Impossible de communiquer avec le serveur.";

        }

    });


/* ========================= */
/* RETIRER AFFECTATION */
/* ========================= */

async function deleteAssignment(id) {

    if (
        !confirm(
            "Retirer ce bénévole de cette mission ?"
        )
    ) {
        return;
    }


    try {

        const response =
            await fetch("/api/assignments", {

                method: "DELETE",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({
                        id: id
                    })

            });


        const result =
            await response.json();


        if (!response.ok || !result.success) {

            alert(
                result.error ||
                "Impossible de supprimer l'affectation."
            );

            return;
        }


        await loadAssignmentLists();

    } catch {

        alert(
            "Impossible de communiquer avec le serveur."
        );

    }

}


/* ========================= */
/* DÉMARRAGE */
/* ========================= */

loadAll();

</script>

</body>
</html>
